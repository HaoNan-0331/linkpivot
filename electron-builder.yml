appId: com.network-topology.manager
productName: 网络拓扑管理工具

# === 输出目录：与 vite renderer 的 dist/ 解耦 ===
# 修复：electron-builder 输出原也在 dist/，files: dist/**/* 会把上一次打包产物
# （win-unpacked/*.exe/*.7z）递归打进 asar，包体滚雪球撑爆 32 位 NSIS 的 2GB mmap 上限
directories:
  output: release

# === asar 打包 ===
asar: true
asarUnpack:
  - "**/*.node"
  - "node_modules/better-sqlite3/**/*"
  - "node_modules/ssh2/**/*"
  - "node_modules/telnet-client/**/*"

# === 文件过滤：只包含运行所需文件 ===
# 双保险：即使 dist/ 残留历史打包产物也不入 asar
files:
  - dist-electron/**/*
  - dist/**/*
  - "!dist/win-unpacked/**"
  - "!dist/*.exe"
  - "!dist/*.7z"
  - "!dist/*.blockmap"
  - package.json
  - "!**/*.{ts,tsx,map}"
  - "!**/LICENSE*"
  - "!**/{README,readme,CHANGELOG,changelog}*"
  - "!**/{.eslintrc,.prettierrc,tsconfig}*"
  - "!**/test{,s}/**"
  - "!**/__test{,s}__/**"
  - "!**/*.{spec,test}.{js,ts,tsx}"
  - "!**/docs/**"
  - "!scripts/**"
  - "!public/**"
  - "!src/**"
  - "!electron/**"

# === 静态资源：格式说明等文档打进安装包 resources/docs（Phase 29 D-10，只读分发） ===
extraResources:
  - from: resources/docs
    to: docs

# === native 模块：自动重建 ===
buildDependenciesFromSource: false
npmRebuild: true

# === 发布配置：GitHub Releases 自动更新源 ===
# 驱动 latest.yml 与安装包内 app-update.yml 生成（electron-updater 运行时读取）
publish:
  provider: github
  owner: HaoNan-0331
  repo: network-topology-manager

# === Windows 配置 ===
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico

# === NSIS 安装程序配置 ===
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  # ASCII 显式产物名：匹配安全字符正则 → safeArtifactName=null →
  # 本地名 = 上传名 = latest.yml url 三位一体（中文名 productName 的清洗链坑不复现）
  artifactName: "Setup.${version}.${ext}"

# === 精简 Electron 语言包 ===
electronLanguages:
  - zh-CN
  - en-US
