name: build-smoke

# P1-c: 打包冒烟 job——防 better-sqlite3/ssh2 native binding ABI 静默失配（CONCERNS DEP-1）。
# push/PR 触发；windows runner 跑 rebuild + build + test + 验证 .node 产物存在。
# 不含 electron-builder 打 installer（CI 慢 + 需签名配置，留作后续扩展）。

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # mock 套件（plain node vitest，244 用例，不碰 native binding）必须在 rebuild:native 之前跑
      # —— rebuild 后 better-sqlite3/ssh2 切 electron-ABI，plain node 加载必触发 NODE_MODULE_VERSION 冲突（DEP-1 在 CI 的体现）
      - run: npm test
      # 显式 native rebuild（接入 electron:build 前置；本地同样经 npm run rebuild:native）
      - run: npm run rebuild:native
      - run: npm run build
      # 真路径回归套件（tests/electron/**）经 electron.exe + ELECTRON_RUN_AS_NODE 跑
      # 必须 rebuild:native 之后（需 electron-ABI native binding）+ build 之后（需 dist-electron/main.js）
      # —— cross-env 跨平台设 ELECTRON_RUN_AS_NODE=1；windows-latest runner 跑 electron.exe（RUN_AS_NODE 模式不走 Chromium，不需 xvfb/--no-sandbox）
      - run: npm run test:electron
      - name: verify native binding built for electron ABI
        shell: bash
        run: |
          test -f node_modules/better-sqlite3/build/Release/better_sqlite3.node
          # CR-03 修复：cpu-features 是 ssh2 1.17 的 optionalDependencies（ssh2 自身纯 JS 无 .node），
          # electron-rebuild -w ssh2 不递归到 cpu-features，故 -w cpu-features 显式重建（见 package.json rebuild:native）。
          # 若 cpu-features 装了（npm ci 触发 optionalDep 编译）则必须验其 .node 为 electron-ABI，
          # 否则 test:electron 跑时 require('ssh2') → require('cpu-features') 会 NODE_MODULE_VERSION mismatch 崩。
          # 用 test ! -d || test -f 模式：cpu-features 未装（如 Linux 跳过 optionalDep）时放行，装了则强制验产物。
          test ! -d node_modules/cpu-features || \
            test -f node_modules/cpu-features/build/Release/cpufeatures.node
          test -f dist-electron/main.js
          echo "native binding + main bundle OK"
